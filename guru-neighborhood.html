<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guru Status — The Neighbourhood</title><style>
/* Layout: three working maps stacked at landing-page width, each under a slim label with a note box. Single light look: these are sections of a light landing page. */
:root{--bg:#FFFFFF;--ink:#172A3A;--muted:#607183;--slate:#667E91;--line:#D8E1E9;--navy:#123D61;--blue:#3678A7;--gold:#B5A47F;--mist:#F2F5F8;--night:#0B1E2E;--night-line:#6F8296;--night-ink:#C9D5DF;--on-navy:#FFFFFF;
--serif:Georgia,'Times New Roman',serif;--sans:'Helvetica Neue','Avenir Next',Arial,sans-serif}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1240px;margin:0 auto;padding-block:44px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--blue)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.4vw,46px);line-height:1.1;margin:12px 0 14px;text-wrap:balance}
.lede{max-width:66ch;color:var(--muted);margin:0}
#sync{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:14px;display:block}
.label{padding-block:52px 16px}
.label h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0}
.label h2 span{font-family:var(--sans);font-size:11px;letter-spacing:.2em;color:var(--blue);margin-right:12px}
.label p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:72ch}
textarea{font:inherit;font-size:14px;width:100%;box-sizing:border-box;min-height:42px;padding:9px 12px;border:1px solid var(--line);background:var(--mist);color:var(--ink);resize:vertical;margin-top:14px}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.plain{border:1px solid var(--line);line-height:0}
.plain img{width:100%;height:auto;display:block}

/* ---------- map component ---------- */
.gm{position:relative;border:1px solid var(--line);overflow:hidden;background:#fff}
.gm .layer{position:relative;container-type:inline-size;line-height:0}
.gm .layer>img{width:100%;height:auto;display:block}
.ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-50%);width:max(22px,var(--ms));height:max(22px,var(--ms));border-radius:50%;padding:0;display:grid;place-items:center;transition:background .25s,border-color .25s,opacity .3s,box-shadow .25s}
.mk svg{width:58%;height:58%;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mk.dim{opacity:.28}
.pn{box-sizing:border-box;background:#fff;color:var(--ink);padding:clamp(22px,3.2cqw,44px);display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-width:0;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:9.500px;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--slate)}
.chips button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.ph{aspect-ratio:16/10;background:var(--mist);display:grid;place-items:center;overflow:hidden;flex:none}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .none{display:flex;flex-direction:column;align-items:center;gap:10px;color:#9FB3C4;font-size:9px;letter-spacing:.2em;text-transform:uppercase}
.ph .none svg{width:64px;height:64px;fill:none;stroke:currentColor;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
.cr{font-size:10px;color:var(--slate);margin-top:-8px;min-height:15px}
.cr a{color:inherit}
.pn h3{font-family:var(--serif);font-weight:400;font-size:clamp(22px,2.4cqw,30px);line-height:1.15;margin:4px 0 0}
.ds{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue)}
.pn p{margin:0;color:var(--muted);font-size:14.500px;line-height:1.7}
.act{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:8px}
.act a{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--navy);text-decoration:none;border:1px solid var(--navy);padding:13px 20px;white-space:nowrap}
.nav{display:flex;gap:8px}
.nav button{width:42px;height:42px;border-radius:50%;border:1px solid var(--navy);background:#fff;color:var(--navy);display:grid;place-items:center}
.nav svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.4}

/* 14: place card, dark map */
.g14{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);container-type:inline-size}
.g14 .layer{--ms:3.9cqw;order:2}
.g14 .pn{order:1;height:0;min-height:100%}
.g14 .mk{background:var(--night);border:1px solid var(--night-line)}
.g14 .mk svg{stroke:var(--night-ink)}
.g14 .mk.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 9px rgba(181,164,127,.2)}
.g14 .mk.on svg{stroke:var(--night)}
.g14 .ln line{stroke:var(--gold)}

@media (max-width:860px){
  .g14{display:block}
  .g14 .layer{--ms:7cqw}
  .g14 .pn{height:auto;min-height:0}
  .g03 .layer{--ms:5cqw}
  .g03 .pn{position:static;width:auto;border-right:0;border-top:1px solid var(--line);transform:none;display:none}
  .g03.open .pn{display:flex}
  .g03.open .layer{transform:none}
  .tog{right:10px;top:10px;padding:9px 12px;font-size:9px}
}
@media (prefers-reduced-motion:reduce){.gm *{transition:none!important}}
.credits{font-size:12px;color:var(--muted);columns:2 320px;margin:10px 0 0;padding:0;list-style:none}
.credits a{color:inherit}

  html,body{margin:0;min-height:0;background:transparent;overflow-x:hidden}
  .wrap{max-width:none;padding:0}
  .g14{border:1px solid #d8e1e9}
  .g14 .pn{height:0;min-height:100%}
  .gm .layer>img{height:auto}
  @media(max-width:860px){.g14 .pn{height:auto;min-height:0}}

/* Category-specific compact place slider — V53 */
.places-switcher{margin-top:5px;border-top:1px solid var(--line);padding-top:12px;min-width:0}
.places-switcher-heading{display:flex;justify-content:space-between;gap:12px;font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:var(--slate);margin-bottom:9px}
.places-switcher-track{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:#d4e0eb transparent;padding:2px 0 9px}
.place-option{flex:0 0 42%;min-width:116px;scroll-snap-align:start;display:flex;align-items:start;gap:6px;text-align:left;padding:11px 9px;border:1px solid var(--line);background:var(--mist);color:var(--ink);font-size:12px;line-height:1.3;min-height:57px;transition:background .2s,border-color .2s,color .2s}
.place-option-index{font-size:9px;letter-spacing:.1em;color:var(--slate);padding-top:2px}
.place-option.active{background:var(--navy);border-color:var(--navy);color:#fff}
.place-option.active .place-option-index{color:#d0dfec}
.place-option:hover:not(.active){border-color:var(--blue);background:#e7f0f6}
@media(max-width:860px){.place-option{flex-basis:45%;min-width:135px}}

/* V54: category-wide gold map markers and uniformly sized, vertically scrollable place cards */
.g14 .pn{gap:10px;overflow:hidden;padding:clamp(18px,2.5cqw,32px);}
.g14 .mk.category-on{background:var(--gold);border-color:var(--gold);opacity:1;box-shadow:0 0 0 4px rgba(181,164,127,.13);}
.g14 .mk.category-on svg{stroke:var(--night);}
.g14 .mk.category-on.on{background:#d1be91;border-color:#e3d3aa;box-shadow:0 0 0 9px rgba(181,164,127,.22),0 0 0 1px rgba(231,212,168,.8);}
.g14 .mk.dim{opacity:.18;}
.place-card-head{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:10px;font:600 10px/1.3 var(--sans);text-transform:uppercase;letter-spacing:.14em;color:var(--slate)}
.place-card-track{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y proximity;scrollbar-width:thin;scrollbar-color:#afc0cf transparent;overscroll-behavior-y:contain;padding-right:5px;display:flex;flex-direction:column;gap:11px;}
.place-card{flex:0 0 auto;min-height:174px;position:relative;scroll-snap-align:start;background:#f8fafc;border:1px solid var(--line);transition:border-color .2s ease,background .2s ease,box-shadow .2s ease;}
.place-card.is-selected{background:#f1f6f9;border-color:#7596af;box-shadow:inset 3px 0 0 #123d61;}
.place-card:hover{border-color:#9cb2c4;}
.place-card-choose{width:100%;display:grid;grid-template-columns:38% minmax(0,1fr);gap:12px;align-items:stretch;padding:10px;border:0;text-align:left;background:transparent;color:inherit;}
.place-card-media{height:128px;background:#e9eff4;display:grid;place-items:center;overflow:hidden;align-self:start;}
.place-card-media>img{display:block;width:100%;height:100%;object-fit:cover;}
.place-card-no-photo{color:#8ea5b6;display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(135deg,#f0f4f7,#e2ebf1);}
.place-card-no-photo svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;}
.place-card-copy{min-width:0;display:flex;flex-direction:column;gap:5px;align-items:flex-start;}
.place-card-count{font:600 9px/1.3 var(--sans);letter-spacing:.16em;color:var(--blue);}
.place-card-title{font:400 clamp(18px,1.8cqw,23px)/1.13 var(--serif);color:var(--ink);}
.place-card-distance{font:600 9px/1.45 var(--sans);letter-spacing:.055em;color:var(--blue);text-transform:uppercase;}
.place-card-description{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;font:12px/1.45 var(--sans);color:var(--muted);}
.place-card-directions{display:inline-flex;align-items:center;gap:7px;text-decoration:none;margin:0 10px 11px;color:var(--navy);font:600 9px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid #a7bdcc;padding-bottom:4px;}
.place-card-directions:hover{color:var(--blue);border-color:var(--blue);}
.place-card-footer{border-top:1px solid var(--line);padding-top:9px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;color:var(--slate);font:600 9px/1.4 var(--sans);letter-spacing:.08em;text-transform:uppercase;}
.place-card-footer .nav button{height:36px;width:36px;}
@media(max-width:860px){
 .g14 .pn{height:auto;min-height:0;overflow:hidden;}
 .place-card-track{height:440px;flex:none;}
 .place-card-title{font-size:20px;}
}
@media(max-width:420px){
 .place-card-choose{grid-template-columns:36% minmax(0,1fr);gap:9px;padding:8px;}
 .place-card-media{height:117px;}

 .place-card-title{font-size:18px;}
 .place-card-description{-webkit-line-clamp:2;}
 .place-card-footer{font-size:8px;}
}

/* V56 · Guru Status editorial neighbourhood redesign.
   Use the same restrained white / cool grey / blue design language as the landing page. */
:root{--line:#DCE6EE;--mist:#F3F6F9;--gold:#B5A47F}

.g14 .place-card-media{width:100%;height:138px;border-radius:10px;overflow:hidden;align-self:stretch;background:#E7EEF4}

.g14 .place-card:hover img{transform:scale(1.035)}
.g14 .place-card-copy{gap:6px;justify-content:center;min-width:0;padding:2px 0}
.g14 .place-card-count{font:600 9px/1.2 var(--sans);letter-spacing:.15em;color:#5A86A6}
.g14 .place-card-title{font:400 clamp(18px,1.65cqw,23px)/1.15 var(--serif);letter-spacing:-.025em;color:#172A3A}
.g14 .place-card-distance{font:600 9px/1.4 var(--sans);letter-spacing:.05em;color:#437CA4}
.g14 .place-card-description{font:12px/1.56 var(--sans);color:#607183;-webkit-line-clamp:3}
.g14 .place-card-footer{padding-top:12px;border-top:1px solid #E5ECF2;color:#8295A5}
.g14 .place-card-footer .nav{gap:8px}

@media(max-width:860px){
  .gm.g14{border-radius:17px}

}
@media(prefers-reduced-motion:reduce){.g14 .place-card:hover{transform:none}.g14 .place-card:hover img{transform:none}}

const P=DATA.places, CATS=['All','Leisure','Shopping','Everyday','Travel','Culture'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function build(el,o){
  let cat='All',sel=o.start;
  const layer=document.createElement('div');layer.className='layer';
  layer.innerHTML=o.imgs+'<svg class="ln" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line vector-effect="non-scaling-stroke" stroke-width="1" stroke-dasharray="2 5" stroke-linecap="round"/></svg>';
  const pn=document.createElement('div');pn.className='pn';
  P.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='mk';b.dataset.k=p.k;b.style.left=p[o.pos][0]+'%';b.style.top=p[o.pos][1]+'%';
    b.setAttribute('aria-label',p.name);b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+p.icon+'"/></svg>';b.onclick=()=>{sel=p.k;draw()};layer.appendChild(b)});
  const list=()=>P.filter(p=>cat==='All'||p.cat===cat);
  const visibleCount=()=>Math.max(1,Math.min(3,list().length));
  const nextInList=(delta)=>{const L=list(),i=L.findIndex(x=>x.k===sel);sel=L[(i+delta+L.length)%L.length].k;draw()};
  function draw(options={}){
    const L=list();
    if(!L.some(p=>p.k===sel)) sel=L[0].k;
    const p=P.find(x=>x.k===sel);
    const oldScroll=pn.querySelector('.place-card-track');
    const savedScroll=oldScroll ? oldScroll.scrollTop : 0;

    /* The selected place gets the strongest halo. Every place in the selected
       category remains gold; places outside that category are subdued. */
    layer.querySelectorAll('.mk').forEach(b=>{
      const q=P.find(x=>x.k===b.dataset.k);
      const categoryMatch=(cat!=='All' && q.cat===cat);
      const selected=(q.k===sel);
      b.classList.toggle('on',selected);
      b.classList.toggle('category-on',categoryMatch);
      b.classList.toggle('dim',cat!=='All' && !categoryMatch);
      b.setAttribute('aria-pressed',String(selected));
    });
    const ln=layer.querySelector('line');
    ln.setAttribute('x1',o.tower[0]);ln.setAttribute('y1',o.tower[1]);
    ln.setAttribute('x2',p[o.pos][0]);ln.setAttribute('y2',p[o.pos][1]);

    const cards=L.map((q,i)=>{
      const active=q.k===sel;
      const far=q.k==='beach'?'A short walk from Guru Status':q.dist+' from Guru Status · straight line';
      const media=q.photo?'<img src="'+q.photo+'" alt="'+esc(q.name)+'" loading="lazy">':
        '<div class="place-card-no-photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+q.icon+'"/></svg></div>';
      return '<article class="place-card'+(active?' is-selected':'')+'" data-place-card="'+q.k+'">'+
        '<button type="button" class="place-card-choose" data-k="'+q.k+'" aria-pressed="'+active+'" aria-label="Show '+esc(q.name)+' on the map">'+
          '<span class="place-card-media">'+media+'</span>'+
          '<span class="place-card-copy">'+
            '<span class="place-card-count">'+String(i+1).padStart(2,'0')+' / '+String(L.length).padStart(2,'0')+'</span>'+
            '<span class="place-card-title">'+esc(q.name)+'</span>'+
            '<span class="place-card-distance">'+esc(far)+'</span>'+
            '<span class="place-card-description">'+esc(q.info)+'</span>'+
          '</span>'+
        '</button>'+
      '</article>';
    }).join('');

    pn.innerHTML='<div class="eyebrow">The neighbourhood</div>'+
      '<div class="chips">'+CATS.map(c=>'<button type="button" aria-pressed="'+(c===cat)+'" data-c="'+c+'">'+c+'</button>').join('')+'</div>'+
      '<div class="place-card-head"><span>'+esc(cat==='All'?'Explore all places':cat+' places')+'</span><span>'+String(L.length).padStart(2,'0')+' places</span></div>'+
      '<div class="place-card-track" role="region" tabindex="0" aria-label="Scroll through '+esc(cat)+' locations">'+cards+'</div>'+
      '<div class="place-card-footer"><span>Scroll to explore locations</span><div class="nav">'+
      '<button type="button" data-d="-1" aria-label="Previous place"><svg viewBox="0 0 14 14"><path d="M9 2L4 7l5 5"/></svg></button>'+
      '<button type="button" data-d="1" aria-label="Next place"><svg viewBox="0 0 14 14"><path d="M5 2l5 5-5 5"/></svg></button></div></div>';

    pn.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;draw({resetScroll:true})});
    pn.querySelectorAll('.place-card-choose').forEach(b=>b.onclick=()=>{
      const track=pn.querySelector('.place-card-track');
      const scrollTop=track.scrollTop;
      sel=b.dataset.k;
      draw({preserveScroll:scrollTop});
    });
    pn.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
      const L=list(),i=L.findIndex(x=>x.k===sel);
      sel=L[(i+Number(b.dataset.d)+L.length)%L.length].k;
      draw({scrollSelected:true});
    });
    const track=pn.querySelector('.place-card-track');
    if(options.scrollSelected){
      const chosen=track.querySelector('.place-card.is-selected');
      if(chosen) chosen.scrollIntoView({block:'nearest',behavior:'smooth'});
    }else if(!options.resetScroll){
      track.scrollTop=options.preserveScroll??savedScroll;
    }
  }
  el.appendChild(layer);el.appendChild(pn);draw();return {layer,pn};
}
